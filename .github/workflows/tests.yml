name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-verify-wait:
    name: check-verify-wait.js（AST 検出のテスト）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash tests/check-verify-wait.test.sh

  check-lang-parity:
    name: jp/en パリティ（ファイル構成 + 見出し構造）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/check-lang-parity.test.sh
